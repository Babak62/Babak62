name: Build Android APK v2.5
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version 2.5 Android source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'tarikhnegar-v2.5-native-processing-source.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo 'Version 2.5 source ZIP was not found in repository root.'
            exit 1
          fi
          mkdir -p /tmp/tarikhnegar-source
          unzip -q "$ZIP_FILE" -d /tmp/tarikhnegar-source
          cp -a /tmp/tarikhnegar-source/tarikhnegar-android/. .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK v2.5
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tarikhnegar-v2.5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
