
name: Build TarikhNegar APK

on:
  workflow_dispatch:
  push:
    paths:
      - tarikhnegar-v2.3-native-processing-source.zip
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q "tarikhnegar-v2.3-native-processing-source.zip"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: tarikhnegar-android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tarikhnegar-apk
          path: tarikhnegar-android/app/build/outputs/apk/debug/app-debug.apk
